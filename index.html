<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Isometrix</title>
  </head>
  <body class="bg-gray-950 overscroll-none">
    <div id="root"></div>
    <!-- Splash screen: epic parallette animation -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;overflow:hidden;">
      <!-- Parallette Logo Animation -->
      <div style="position:relative;width:80px;height:100px;">
        <!-- Left bar (slides in from left) -->
        <div id="bar-left" style="position:absolute;left:18px;top:0;width:14px;height:100%;background:#fff;border-radius:3px;transform:translateX(-120px);opacity:0;animation:slideFromLeft 0.6s ease-out 0.2s forwards;"></div>
        <!-- Right bar (slides in from right) -->
        <div id="bar-right" style="position:absolute;right:18px;top:0;width:14px;height:100%;background:#fff;border-radius:3px;transform:translateX(120px);opacity:0;animation:slideFromRight 0.6s ease-out 0.2s forwards;"></div>
        <!-- Top crossbar (drops down) -->
        <div id="bar-top" style="position:absolute;top:0;left:8px;right:8px;height:14px;background:#fff;border-radius:4px;transform:translateY(-60px);opacity:0;animation:dropDown 0.4s ease-out 0.7s forwards;"></div>
        <!-- Bottom crossbar (rises up) -->
        <div id="bar-bottom" style="position:absolute;bottom:0;left:8px;right:8px;height:14px;background:#fff;border-radius:4px;transform:translateY(60px);opacity:0;animation:riseUp 0.4s ease-out 0.7s forwards;"></div>
      </div>
      <!-- Wordmark fades in after logo assembles -->
      <div style="margin-top:24px;opacity:0;animation:fadeInText 0.5s ease-out 1.2s forwards;">
        <img src="/branding/wordmark-light.png" alt="Isometrix" style="width:160px;height:auto;" />
      </div>
      <style>
        @keyframes slideFromLeft{to{transform:translateX(0);opacity:1}}
        @keyframes slideFromRight{to{transform:translateX(0);opacity:1}}
        @keyframes dropDown{to{transform:translateY(0);opacity:1}}
        @keyframes riseUp{to{transform:translateY(0);opacity:1}}
        @keyframes fadeInText{to{opacity:1}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
