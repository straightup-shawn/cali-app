<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Isometrix</title>
  </head>
  <body class="bg-gray-950 overscroll-none">
    <div id="root"></div>
    <!-- Splash screen: parallettes → logo animation -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;overflow:hidden;">
      <svg viewBox="0 0 200 160" width="200" height="160" xmlns="http://www.w3.org/2000/svg">
        <!-- Person silhouette (fades out) -->
        <g id="person" style="opacity:1;animation:personFade 0.4s ease-out 1.0s forwards;">
          <!-- Head -->
          <circle cx="100" cy="42" r="8" fill="#fff"/>
          <!-- Body -->
          <line x1="100" y1="50" x2="100" y2="80" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <!-- Arms reaching down to parallettes -->
          <line x1="100" y1="58" x2="72" y2="78" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <line x1="100" y1="58" x2="128" y2="78" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <!-- Legs (L-sit position) -->
          <line x1="100" y1="80" x2="85" y2="95" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <line x1="85" y1="95" x2="90" y2="110" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <line x1="100" y1="80" x2="115" y2="95" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <line x1="115" y1="95" x2="110" y2="110" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Left parallette (starts horizontal, rotates + moves to form left half of I) -->
        <g id="p-left" style="transform-origin:72px 90px;animation:paralletteLeft 0.8s ease-in-out 1.4s forwards;">
          <!-- Horizontal bar -->
          <rect x="52" y="86" width="40" height="8" rx="3" fill="#fff"/>
          <!-- Legs -->
          <rect x="58" y="80" width="6" height="14" rx="2" fill="#fff"/>
          <rect x="80" y="80" width="6" height="14" rx="2" fill="#fff"/>
        </g>

        <!-- Right parallette (starts horizontal, rotates + moves to form right half of I) -->
        <g id="p-right" style="transform-origin:128px 90px;animation:paralletteRight 0.8s ease-in-out 1.4s forwards;">
          <!-- Horizontal bar -->
          <rect x="108" y="86" width="40" height="8" rx="3" fill="#fff"/>
          <!-- Legs -->
          <rect x="114" y="80" width="6" height="14" rx="2" fill="#fff"/>
          <rect x="136" y="80" width="6" height="14" rx="2" fill="#fff"/>
        </g>
      </svg>

      <!-- Wordmark fades in after logo forms -->
      <div style="margin-top:16px;opacity:0;animation:fadeInWord 0.5s ease-out 2.4s forwards;">
        <img src="/branding/wordmark-light.png" alt="Isometrix" style="width:160px;height:auto;" />
      </div>

      <style>
        @keyframes personFade {
          to { opacity: 0; }
        }
        @keyframes paralletteLeft {
          40% { transform: rotate(-90deg) translate(0, 0); }
          100% { transform: rotate(-90deg) translate(18px, -10px) scale(0.9); }
        }
        @keyframes paralletteRight {
          40% { transform: rotate(-90deg) translate(0, 0); }
          100% { transform: rotate(-90deg) translate(-18px, -10px) scale(0.9); }
        }
        @keyframes fadeInWord {
          to { opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
